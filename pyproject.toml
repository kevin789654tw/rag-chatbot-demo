[tool.poetry]
name = "carbon-rag-poc"
version = "0.1.0"
description = "Carbon Management RAG System with Function Calling/MCP"
authors = ["Kevin Lin <kevin789654tw@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-community = "^0.3.0"
sentence-transformers = "^3.0.0"
faiss-cpu = "^1.8.0"
pandas = "^2.2.0"
openpyxl = "^3.1.0"
chainlit = "^1.3.0"
python-dotenv = "^1.0.0"
tiktoken = "^0.7.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.3.0"
structlog = "^24.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
ruff = "^0.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
